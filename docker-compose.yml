# Para subir:  docker compose up --build
# A chave da LLM vem do arquivo .env (copie o .env.example para .env e cole a chave).
services:
  nexo-assist:
    build: .
    ports:
      - "3001:3001"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_MODELO: ${LLM_MODELO:-gemini-2.5-flash}
      SISTEMA_INSTAVEL: ${SISTEMA_INSTAVEL:-true}
      DB_FILE: /data/nexo.db
    volumes:
      - nexo-data:/data # o banco SQLite fica aqui e sobrevive a reinícios do container
    restart: unless-stopped

volumes:
  nexo-data:
